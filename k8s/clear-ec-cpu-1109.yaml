# CPU-only research pod for CLEAR-EC lanes (2026-11-09, PI request: "cpu 병목이면 cpu pod 올려").
# Same image and workspace PVC (DDN RWX) as clear-ec-research-4gpu-1104, so /workspace/venv works unchanged.
# Pattern follows clear-ec-statread-cpu.yaml: H200 zone, GPU taint tolerated, no GPU requested.
apiVersion: v1
kind: Pod
metadata:
  name: clear-ec-cpu-1109
  namespace: p-ajou-mlxp-project
  labels:
    app: clear-ec
    stage: persistent-research
    workload: cpu-lanes
    mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
spec:
  priorityClassName: private-zone
  restartPolicy: Never
  terminationGracePeriodSeconds: 30
  nodeSelector:
    mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
    - name: cpu
      image: leebyounghan/mlx-rl:20261025-sgl0512-verl-1ddf071
      imagePullPolicy: IfNotPresent
      command: [bash, -lc]
      args: ['trap "exit 0" TERM INT; while true; do sleep 300 & wait $!; done']
      workingDir: /workspace/clear-ec-research
      env:
        - {name: NVIDIA_VISIBLE_DEVICES, value: void}
        - {name: CUDA_VISIBLE_DEVICES, value: ""}
        - {name: PYTHONPATH, value: /workspace/clear-ec-research/experiments/phase2_foundation_20261002/runtime}
        - {name: HF_HUB_OFFLINE, value: "1"}
        - {name: HF_HUB_DISABLE_PROGRESS_BARS, value: "1"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
        - {name: OMP_NUM_THREADS, value: "1"}
        - {name: OPENBLAS_NUM_THREADS, value: "1"}
      resources:
        requests: {cpu: "32", memory: 64Gi}
        limits: {cpu: "32", memory: 128Gi}
      volumeMounts:
        - {name: workspace, mountPath: /workspace}
        - {name: shared-memory, mountPath: /dev/shm}
  volumes:
    - name: workspace
      persistentVolumeClaim: {claimName: clear-ec-workspace}
    - name: shared-memory
      emptyDir: {medium: Memory, sizeLimit: 8Gi}
