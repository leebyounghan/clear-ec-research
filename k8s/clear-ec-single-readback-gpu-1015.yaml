apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-single-readback-gpu-1015
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: crossfold-inference-readback}
spec:
  suspend: true
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: clear-ec, workload: crossfold-inference-readback}
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      priorityClassName: private-zone
      activeDeadlineSeconds: 1770
      terminationGracePeriodSeconds: 30
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: readback
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - |
              set -euo pipefail
              remaining=$((1792382340 - $(date -u +%s)))
              if (( remaining < 1800 )); then
                echo 'Insufficient time for bounded inference readback before deadline'
                exit 3
              fi
              if (( remaining > 1740 )); then remaining=1740; fi
              /workspace/venv/bin/python - <<'PY'
              import hashlib,json
              from pathlib import Path
              root=Path('experiments/phase2_crossfold_20261015/inference_readback_20261015')
              sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
              assert sha(root/'source_inventory.json')=='b44b9b94eecaa9a3eb5faa93ae7ddb34e461b3fc6cabe832da767db60c935a30'
              inventory=json.loads((root/'source_inventory.json').read_text())
              for name,want in inventory['source_sha256'].items(): assert sha(root/'source'/name)==want,name
              assert sha(root/'cpu_readback.json')=='15d25c1cdd45f5f5ca33f7640fc91bb0ec66463d9d6fbf3666d930bd3dbb7c69'
              cpu=json.loads((root/'cpu_readback.json').read_text())
              assert cpu['status']=='passed' and cpu['cuda_initialized'] is False
              manifest=Path(inventory['reference_manifest'])
              assert sha(manifest)==inventory['reference_manifest_sha256']
              assert sha(manifest.parent/'runs/fold3/cpdino_vitb/result.json')==inventory['reference_result_sha256']
              assert not (root/'gpu_readback.json').exists(),'No overwrite or automatic retry'
              print(json.dumps({'preflight':'passed','single_model':True,'selected_cases':8,'t4_certified':False}),flush=True)
              PY
              timeout --signal=TERM --kill-after=30s "$remaining" /workspace/venv/bin/python -u \
                experiments/phase2_crossfold_20261015/inference_readback_20261015/source/phase2_single_model_readback_20261015.py \
                gpu --workspace /workspace/clear-ec-research \
                --manifest experiments/phase2_lejepa5_sweep_20261013/arms/head1e4_clip3/manifest.json \
                --output experiments/phase2_crossfold_20261015/inference_readback_20261015/gpu_readback.json
          env:
            - {name: PYTHONPATH, value: /workspace/clear-ec-research/experiments/phase2_foundation_20261002/runtime}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: OPENBLAS_NUM_THREADS, value: "2"}
            - {name: HF_HUB_OFFLINE, value: "1"}
          resources:
            requests: {cpu: "2", memory: 8Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 24Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: shared-memory, mountPath: /dev/shm}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
        - name: shared-memory
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
