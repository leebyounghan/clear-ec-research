apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-p2-fullnative-head-0929
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: phase2-fullnative-head}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: clear-ec, workload: phase2-fullnative-head}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      activeDeadlineSeconds: 10800
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/hardware-type: gpu
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: researcher
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - >-
              exec timeout --signal=TERM --kill-after=30s 9000
              /workspace/venv/bin/python -u
              experiments/phase2_fullnative_20260929/source/phase2_fullnative_head.py
          env:
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OMP_NUM_THREADS, value: "8"}
            - {name: OPENBLAS_NUM_THREADS, value: "8"}
          resources:
            requests: {cpu: "8", memory: 8Gi}
            limits: {cpu: "8", memory: 16Gi}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
