apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-gpu-probe-0923
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: capacity-probe}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels: {app: clear-ec, workload: capacity-probe}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/hardware-type: gpu
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: probe
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          imagePullPolicy: IfNotPresent
          command: [bash, -lc]
          args: ["nvidia-smi --query-gpu=name,memory.total --format=csv,noheader && date -u"]
          resources:
            requests: {cpu: "1", memory: 2Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "2", memory: 4Gi, nvidia.com/gpu: "1"}
