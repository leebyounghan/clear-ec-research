apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-p2-cpsam-scale-1001
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: phase2-cpsam-scale}
spec:
  completionMode: Indexed
  completions: 3
  parallelism: 2
  backoffLimit: 0
  activeDeadlineSeconds: 172800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: clear-ec, workload: phase2-cpsam-scale}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      activeDeadlineSeconds: 108000
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/hardware-type: gpu
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: researcher
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - |-
              set -euo pipefail
              case "${JOB_COMPLETION_INDEX}" in
                0) arm=native256 ;;
                1) arm=central512 ;;
                2) arm=full972x1296 ;;
                *) echo "Unexpected index" >&2; exit 2 ;;
              esac
              exec timeout --signal=TERM --kill-after=30s 106000 /workspace/venv/bin/python -u experiments/phase2_cpsam_scale_20261001/source/phase2_cpsam_scale_20261001.py worker --arm "${arm}"
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: OPENBLAS_NUM_THREADS, value: "4"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
          resources:
            requests: {cpu: "6", memory: 24Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "6", memory: 64Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
