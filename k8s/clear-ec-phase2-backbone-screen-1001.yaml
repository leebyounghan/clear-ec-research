apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-p2-backbone-1001
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: phase2-backbone-screen}
spec:
  completionMode: Indexed
  completions: 4
  parallelism: 4
  backoffLimit: 0
  activeDeadlineSeconds: 604800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: clear-ec, workload: phase2-backbone-screen}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      activeDeadlineSeconds: 57600
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/hardware-type: gpu
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: researcher
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - |-
              set -euo pipefail
              case "${JOB_COMPLETION_INDEX}" in
                0) architecture=dino_vitb14; fold=2 ;;
                1) architecture=dino_vitb14; fold=3 ;;
                2) architecture=convnext_base; fold=2 ;;
                3) architecture=convnext_base; fold=3 ;;
                *) echo "Unexpected index ${JOB_COMPLETION_INDEX}" >&2; exit 2 ;;
              esac
              echo "Backbone screen: index=${JOB_COMPLETION_INDEX}, architecture=${architecture}, fold=${fold}"
              exec timeout --signal=TERM --kill-after=30s 55800 /workspace/venv/bin/python -u experiments/phase2_backbone_screen_20261001/source/phase2_backbone_screen_20261001.py worker --architecture "${architecture}" --fold "${fold}"
          env:
            - name: JOB_COMPLETION_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['batch.kubernetes.io/job-completion-index']
            - {name: HF_HOME, value: /workspace/clear-ec-research/experiments/phase2_backbone_screen_20261001/hf_cache}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: OPENBLAS_NUM_THREADS, value: "4"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
          resources:
            requests: {cpu: "6", memory: 24Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "6", memory: 64Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
