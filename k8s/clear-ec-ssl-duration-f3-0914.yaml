apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-ssl-duration-f3-0914
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: ssl-duration}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 41400
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app: clear-ec, workload: ssl-duration}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/hardware-type: gpu
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: researcher
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - exec timeout --signal=TERM --kill-after=30s 39900 /workspace/venv/bin/python -u experiments/ssl_duration_20260914/source/ssl_duration_20260914.py run --fold 3
          env:
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: OPENBLAS_NUM_THREADS, value: "4"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
          resources:
            requests: {cpu: "6", memory: 24Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "6", memory: 64Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 8Gi}
