apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clear-ec-workspace
  namespace: p-ajou-mlxp-project
  labels:
    app: clear-ec
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 500Gi
  storageClassName: ddn-ajou-mlxp
---
apiVersion: v1
kind: Pod
metadata:
  name: clear-ec-h200-0
  namespace: p-ajou-mlxp-project
  labels:
    app: clear-ec
    workload: research
spec:
  priorityClassName: private-zone
  restartPolicy: Never
  nodeSelector:
    mlx.navercorp.com/gpu-type: H200
    mlx.navercorp.com/hardware-type: gpu
    mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: researcher
      image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
      imagePullPolicy: IfNotPresent
      workingDir: /workspace
      command:
        - bash
        - -lc
        - sleep infinity
      env:
        - name: PYTHONNOUSERSITE
          value: "1"
        - name: PYTORCH_CUDA_ALLOC_CONF
          value: expandable_segments:True
        - name: HF_HOME
          value: /workspace/.cache/huggingface
        - name: TORCH_HOME
          value: /workspace/.cache/torch
      resources:
        requests:
          cpu: "96"
          memory: 512Gi
          nvidia.com/gpu: "8"
        limits:
          cpu: "96"
          memory: 1600Gi
          nvidia.com/gpu: "8"
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: clear-ec-workspace
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 256Gi
