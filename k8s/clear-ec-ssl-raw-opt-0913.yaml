apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-ssl-raw-opt-0913
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: ssl-raw-opt-0913}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 50400
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app: clear-ec, workload: ssl-raw-opt-0913}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/hardware-type: gpu
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: researcher
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - exec timeout --signal=TERM --kill-after=30s 48000 /workspace/venv/bin/python -u experiments/raw_ssl_next_20260913/source/next_candidate_20260913.py ssl-run
          env:
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
            - {name: HF_HOME, value: /workspace/.cache/huggingface}
            - {name: TORCH_HOME, value: /workspace/.cache/torch}
          resources:
            requests: {cpu: "18", memory: 72Gi, nvidia.com/gpu: "3"}
            limits: {cpu: "18", memory: 144Gi, nvidia.com/gpu: "3"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 24Gi}
