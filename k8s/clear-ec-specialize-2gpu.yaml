apiVersion: v1
kind: Pod
metadata:
  name: clear-ec-specialize-2gpu
  namespace: p-ajou-mlxp-project
  labels:
    app: clear-ec
    workload: specialist-screen
spec:
  priorityClassName: private-zone
  restartPolicy: Never
  nodeSelector:
    mlx.navercorp.com/gpu-type: H200
    mlx.navercorp.com/hardware-type: gpu
    mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: researcher
      image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
      imagePullPolicy: IfNotPresent
      workingDir: /workspace/clear-ec-research
      command: [bash, -lc, "sleep infinity"]
      env:
        - {name: PYTHONNOUSERSITE, value: "1"}
        - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
        - {name: HF_HOME, value: /workspace/.cache/huggingface}
        - {name: TORCH_HOME, value: /workspace/.cache/torch}
      resources:
        requests: {cpu: "24", memory: 128Gi, nvidia.com/gpu: "2"}
        limits: {cpu: "24", memory: 400Gi, nvidia.com/gpu: "2"}
      volumeMounts:
        - {name: workspace, mountPath: /workspace}
        - {name: dshm, mountPath: /dev/shm}
  volumes:
    - name: workspace
      persistentVolumeClaim: {claimName: clear-ec-workspace}
    - name: dshm
      emptyDir: {medium: Memory, sizeLimit: 64Gi}
