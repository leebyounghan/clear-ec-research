apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-crossfold-f4-ssl5-1015
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: crossfold-1015, stage: ssl5, fold: "4"}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 32400
  ttlSecondsAfterFinished: 172800
  template:
    metadata:
      labels: {app: clear-ec, workload: crossfold-1015, stage: ssl5, fold: "4"}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      activeDeadlineSeconds: 31800
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: train
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - |
              set -euo pipefail
              remaining=$((1792382340 - $(date -u +%s)))
              if (( remaining < 28800 )); then
                echo 'Insufficient time for complete SSL5 before research deadline'
                exit 3
              fi
              timeout --signal=TERM --kill-after=30s "$remaining" bash -lc '
                set -euo pipefail
                runner=experiments/phase2_crossfold_20261015/fold4/ssl5/source/phase2_crossfold_ssl_20261015.py
                common=(--root experiments/phase2_crossfold_20261015/fold4/ssl5 --split experiments/target_fold4_20260912/preflight/fold4.npz --fold 4 --seed 1003 --epochs 5 --deadline-utc 2026-10-19T03:59:00Z)
                /workspace/venv/bin/python -u "$runner" smoke "${common[@]}"
                /workspace/venv/bin/python -u "$runner" train "${common[@]}"
              '
          env:
            - {name: PYTHONPATH, value: /workspace/clear-ec-research/experiments/phase2_foundation_20261002/runtime}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: HF_HUB_DISABLE_PROGRESS_BARS, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: OPENBLAS_NUM_THREADS, value: "2"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: expandable_segments:True}
          resources:
            requests: {cpu: "4", memory: 20Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "8", memory: 48Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: shared-memory, mountPath: /dev/shm}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
        - name: shared-memory
          emptyDir: {medium: Memory, sizeLimit: 4Gi}
