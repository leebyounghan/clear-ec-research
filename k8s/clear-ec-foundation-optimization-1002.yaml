apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-cpsam-memory-check-v2-1002
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: foundation-optimization}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: clear-ec, workload: foundation-optimization}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      activeDeadlineSeconds: 7200
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: check
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - |-
              set -euo pipefail
              runner=experiments/phase2_foundation_optimization_20261002/source/phase2_cpsam_memory_check_20261002.py
              /workspace/venv/bin/python -u "$runner" parity
              /workspace/venv/bin/python -u "$runner" benchmark
          env:
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
          resources:
            requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 48Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-dinov3-preflight-v2-1002
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: foundation-optimization}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 10800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app: clear-ec, workload: foundation-optimization}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      activeDeadlineSeconds: 7200
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: check
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - |-
              set -euo pipefail
              runner=experiments/phase2_foundation_optimization_20261002/source/phase2_foundation_preflight_20261002.py
              /workspace/venv/bin/python -u "$runner" worker --architecture dinov3_vitb
              /workspace/venv/bin/python -u "$runner" one --architecture cpdino_vitb --arm full_native972x1296 --batch 4 --output experiments/phase2_foundation_optimization_20261002/cpdino_full_batch4.json
          env:
            - {name: CLEAR_EC_PREFLIGHT_ROOT, value: experiments/phase2_foundation_optimization_20261002}
            - {name: PYTHONPATH, value: /workspace/clear-ec-research/experiments/phase2_foundation_20261002/runtime}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: HF_HUB_DISABLE_PROGRESS_BARS, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
          resources:
            requests: {cpu: "4", memory: 16Gi, nvidia.com/gpu: "1"}
            limits: {cpu: "4", memory: 32Gi, nvidia.com/gpu: "1"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
