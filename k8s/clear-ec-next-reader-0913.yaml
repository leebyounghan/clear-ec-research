apiVersion: v1
kind: Pod
metadata:
  name: clear-ec-next-reader-0913
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: next-result-reader}
spec:
  automountServiceAccountToken: false
  priorityClassName: private-zone
  restartPolicy: Never
  activeDeadlineSeconds: 1800
  nodeSelector:
    mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
    - name: researcher
      image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
      workingDir: /workspace/clear-ec-research
      command: [bash, -lc, "sleep 1740"]
      env:
        - {name: NVIDIA_VISIBLE_DEVICES, value: void}
        - {name: CUDA_VISIBLE_DEVICES, value: ""}
        - {name: PYTHONNOUSERSITE, value: "1"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "2", memory: 4Gi}
      volumeMounts:
        - {name: workspace, mountPath: /workspace, readOnly: true}
  volumes:
    - name: workspace
      persistentVolumeClaim: {claimName: clear-ec-workspace, readOnly: true}
