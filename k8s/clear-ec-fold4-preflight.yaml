apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-fold4-preflight-0912
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: fold4-preflight}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app: clear-ec, workload: fold4-preflight}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      nodeSelector:
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: researcher
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - |
              set -euo pipefail
              mkdir experiments/target_fold4_20260912
              mkdir experiments/target_fold4_20260912/source
              cp /replication-source/overnight_target.py /replication-source/test_overnight_target.py experiments/target_fold4_20260912/source/
              /workspace/venv/bin/python experiments/target_fold4_20260912/source/test_overnight_target.py
              exec /workspace/venv/bin/python -u experiments/target_fold4_20260912/source/overnight_target.py prepare
          env:
            - {name: CLEAR_EC_REPLICATION_ROOT, value: experiments/target_fold4_20260912}
            - {name: CLEAR_EC_REPLICATION_FOLDS, value: "4"}
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
            - {name: CUDA_VISIBLE_DEVICES, value: ""}
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: OPENBLAS_NUM_THREADS, value: "4"}
          resources:
            requests: {cpu: "4", memory: 8Gi}
            limits: {cpu: "4", memory: 16Gi}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: source, mountPath: /replication-source, readOnly: true}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
        - name: source
          configMap: {name: clear-ec-fold4-source-0912}
