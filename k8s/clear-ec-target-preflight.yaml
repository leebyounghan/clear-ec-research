apiVersion: v1
kind: Pod
metadata:
  name: clear-ec-target-preflight-0912
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: target-preflight}
spec:
  automountServiceAccountToken: false
  priorityClassName: private-zone
  restartPolicy: Never
  activeDeadlineSeconds: 3600
  nodeSelector:
    mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
  tolerations:
    - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
  containers:
    - name: researcher
      image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
      workingDir: /workspace/clear-ec-research
      command: [bash, -lc, "sleep 3540"]
      env:
        - {name: NVIDIA_VISIBLE_DEVICES, value: void}
        - {name: CUDA_VISIBLE_DEVICES, value: ""}
        - {name: PYTHONNOUSERSITE, value: "1"}
        - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
      resources:
        requests: {cpu: "2", memory: 4Gi}
        limits: {cpu: "4", memory: 12Gi}
      volumeMounts:
        - {name: workspace, mountPath: /workspace}
  volumes:
    - name: workspace
      persistentVolumeClaim: {claimName: clear-ec-workspace}
