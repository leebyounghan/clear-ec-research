apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-ssl-release-archive-0914
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: ssl-release-archive}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 39600
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app: clear-ec, workload: ssl-release-archive}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      nodeSelector:
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: researcher
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          workingDir: /workspace/clear-ec-research
          command: [/workspace/venv/bin/python, -u, experiments/ssl_release_20260914/source/ssl_release_20260914.py, archive]
          env:
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: NVIDIA_VISIBLE_DEVICES, value: void}
            - {name: CUDA_VISIBLE_DEVICES, value: ""}
          resources:
            requests: {cpu: "2", memory: 2Gi}
            limits: {cpu: "2", memory: 4Gi}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
