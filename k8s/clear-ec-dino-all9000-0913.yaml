apiVersion: batch/v1
kind: Job
metadata:
  name: clear-ec-dino-all9000-0913
  namespace: p-ajou-mlxp-project
  labels: {app: clear-ec, workload: dino-all9000}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 30000
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels: {app: clear-ec, workload: dino-all9000}
    spec:
      automountServiceAccountToken: false
      priorityClassName: private-zone
      restartPolicy: Never
      nodeSelector:
        mlx.navercorp.com/gpu-type: H200
        mlx.navercorp.com/hardware-type: gpu
        mlx.navercorp.com/zone: private-h200-ajou-mlxp-0
      tolerations:
        - {key: nvidia.com/gpu, operator: Exists, effect: NoSchedule}
      containers:
        - name: researcher
          image: leebyounghan/mlx-rl:20260810-sgl0512-verl-1ddf071
          workingDir: /workspace/clear-ec-research
          command: [bash, -lc]
          args:
            - exec timeout --signal=TERM --kill-after=30s 29100 /workspace/venv/bin/python -u experiments/dino_all9000_20260913/source/dino_all9000.py run
          env:
            - {name: PYTHONNOUSERSITE, value: "1"}
            - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
            - {name: PYTORCH_CUDA_ALLOC_CONF, value: "expandable_segments:True"}
            - {name: OMP_NUM_THREADS, value: "4"}
            - {name: OPENBLAS_NUM_THREADS, value: "4"}
          resources:
            requests: {cpu: "12", memory: 48Gi, nvidia.com/gpu: "2"}
            limits: {cpu: "12", memory: 96Gi, nvidia.com/gpu: "2"}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
            - {name: dshm, mountPath: /dev/shm}
      volumes:
        - name: workspace
          persistentVolumeClaim: {claimName: clear-ec-workspace}
        - name: dshm
          emptyDir: {medium: Memory, sizeLimit: 16Gi}
