<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CLEAR-EC KG Explorer</title>
<style>
/* A territory map of the CLEAR-EC knowledge graph: literature regions, experiment lanes, project knowledge.
   Self-contained: system fonts, a built-in canvas renderer, no network requests. */
:root {
  --bg: #f4f6f8; --surface: #ffffff; --region: #e9edf2; --region-hover: #dee4eb; --ink: #18212b; --muted: #55606e; --line: #d6dce3; --edge: #9aa6b4; --accent: #1d5bbf; --accent-tint: #e3ebf9;
  --good: #006300; --bad: #b42318; --warn-bg: #fff4d6; --warn-ink: #6b4a00;
  --t-experiment: #2a78d6; --t-paper: #eb6834; --t-method: #008300; --t-dataset: #a65a1e; --t-finding: #eda100; --t-idea: #1baf7a; --t-decision: #6250d6; --t-constraint: #e34948; --t-synthesis: #e87ba4; --t-stub: #9aa3ad; --t-other: #7d8794;
  --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, "Helvetica Neue", Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1419; --surface: #161d26; --region: #18212c; --region-hover: #212c39; --ink: #e5eaf0; --muted: #9aa6b3; --line: #2a3542; --edge: #4d5b72; --accent: #79a6ff; --accent-tint: #1b2a44;
  --good: #3ccf6a; --bad: #ff7a70; --warn-bg: #3a2f12; --warn-ink: #f3d58a;
  --t-experiment: #3987e5; --t-paper: #d95926; --t-method: #2f9a2f; --t-dataset: #c47a3d; --t-finding: #c98500; --t-idea: #199e70; --t-decision: #9085e9; --t-constraint: #e66767; --t-synthesis: #d55181; --t-stub: #5d6876; --t-other: #7d8794;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1419; --surface: #161d26; --region: #18212c; --region-hover: #212c39; --ink: #e5eaf0; --muted: #9aa6b3; --line: #2a3542; --edge: #4d5b72; --accent: #79a6ff; --accent-tint: #1b2a44;
  --good: #3ccf6a; --bad: #ff7a70; --warn-bg: #3a2f12; --warn-ink: #f3d58a;
  --t-experiment: #3987e5; --t-paper: #d95926; --t-method: #2f9a2f; --t-dataset: #c47a3d; --t-finding: #c98500; --t-idea: #199e70; --t-decision: #9085e9; --t-constraint: #e66767; --t-synthesis: #d55181; --t-stub: #5d6876; --t-other: #7d8794;
  color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
button { font: inherit; color: inherit; }
input:focus-visible, select:focus-visible, button:focus-visible, .row:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
a { color: var(--accent); }

.app { display: grid; height: 100%; grid-template-columns: auto minmax(0, 1fr) auto; grid-template-rows: auto minmax(0, 1fr);
  grid-template-areas: "bar bar bar" "rail main detail"; }
.bar { grid-area: bar; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand h1 { font-size: 0.98rem; margin: 0; letter-spacing: -0.01em; white-space: nowrap; }
.search { position: relative; flex: 0 1 320px; min-width: 170px; }
.search input { width: 100%; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; }
.suggest { position: absolute; z-index: 30; top: calc(100% + 4px); left: 0; width: min(500px, 92vw); max-height: 70vh; overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(10, 20, 30, 0.18); }
.suggest button { display: grid; grid-template-columns: 14px minmax(0, 1fr); gap: 1px 8px; align-items: center; width: 100%; padding: 7px 10px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
.suggest button:hover, .suggest button.cur { background: var(--accent-tint); }
.suggest b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest small { grid-column: 2; color: var(--muted); font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.suggest small.snip { white-space: normal; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
.suggest mark { background: var(--accent-tint); color: var(--ink); border-radius: 2px; }
.suggest .foot { padding: 6px 10px; color: var(--muted); font-size: 0.76rem; }
.views { display: flex; gap: 2px; overflow-x: auto; min-width: 0; }
.views button { padding: 5px 10px; border: 0; background: none; border-radius: 6px; font-size: 0.84rem; color: var(--muted); cursor: pointer; white-space: nowrap; }
.views button:hover { background: var(--bg); color: var(--ink); }
.views button[aria-pressed="true"] { background: var(--accent-tint); color: var(--accent); font-weight: 600; }
.stats { margin-left: auto; font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); white-space: nowrap; }
.theme-btn { padding: 4px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); font-size: 0.76rem; color: var(--muted); cursor: pointer; white-space: nowrap; }

.rail { grid-area: rail; width: 240px; background: var(--surface); border-right: 1px solid var(--line); overflow-y: auto; padding: 14px; padding-left: max(14px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; align-content: start; }
.group { display: grid; gap: 6px; min-width: 0; }
.label { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.sublabel { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
.rail select { width: 100%; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; font-size: 0.82rem; }
.check { display: flex; gap: 6px; align-items: center; font-size: 0.82rem; cursor: pointer; }
.regions { display: grid; gap: 1px; padding-inline: 7px; }
.regions button { display: flex; justify-content: space-between; gap: 8px; width: 100%; padding: 3px 7px; margin-inline: -7px; border: 0; background: none; border-radius: 5px; font-size: 0.82rem; text-align: left; cursor: pointer; }
.regions button:hover { background: var(--bg); color: var(--accent); }
.regions span { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 6px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); font-size: 0.76rem; cursor: pointer; }
.chip[aria-pressed="false"] { opacity: 0.45; background: none; text-decoration: line-through; }
.chip .n { color: var(--muted); font-family: var(--font-mono); font-size: 0.68rem; }
.ico { width: 12px; height: 12px; flex: none; display: block; }

main { grid-area: main; position: relative; min-width: 0; min-height: 0; background: var(--bg); }
#stage, #list, #ego { position: absolute; inset: 0; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.hint { position: absolute; left: 14px; top: 10px; color: var(--muted); font-size: 0.78rem; pointer-events: none; }
.zoom { position: absolute; right: 12px; bottom: 12px; display: flex; flex-direction: column; gap: 4px; }
.zoom button { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); cursor: pointer; font-size: 1rem; line-height: 1; }
.zoom button.wide { font-size: 0.7rem; }
.tip { position: absolute; z-index: 20; max-width: 340px; padding: 7px 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; box-shadow: 0 6px 18px rgba(10, 20, 30, 0.16); font-size: 0.8rem; pointer-events: none; }
.tip b { display: block; font-weight: 600; line-height: 1.35; }
.tip span { display: block; color: var(--muted); font-size: 0.74rem; }

#list { overflow-y: auto; padding: 12px max(20px, env(safe-area-inset-right, 0px)) 24px max(20px, env(safe-area-inset-left, 0px)); }
.list-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.list-head h2 { margin: 0; font-size: 1rem; }
.list-head .n { font-family: var(--font-mono); font-size: 0.76rem; color: var(--muted); }
.list-head select { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--ink); font: inherit; font-size: 0.8rem; }
.lh { margin: 18px 0 2px; font-size: 0.74rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { padding: 9px 0; border-bottom: 1px solid var(--line); display: grid; gap: 2px; cursor: pointer; }
.row:hover .rt { color: var(--accent); }
.row.sel .rt { color: var(--accent); }
.rt { font-weight: 600; display: flex; gap: 7px; align-items: baseline; }
.rt .ico { align-self: center; }
.rm { color: var(--muted); font-size: 0.82rem; overflow-wrap: anywhere; }

/* Connection view: what points here on the left, what this points to on the right */
#ego { overflow-y: auto; background: var(--bg); }
.ego-top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px; background: var(--bg); border-bottom: 1px solid var(--line); font-size: 0.8rem; }
.ego-top button { background: none; border: 0; padding: 2px 4px; color: var(--accent); cursor: pointer; border-radius: 4px; }
.ego-top button.back { font-weight: 600; }
.ego-top .crumbs { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; color: var(--muted); min-width: 0; }
.ego-top label { margin-left: auto; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
.ego-body { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) minmax(170px, 240px) minmax(0, 1fr); gap: 56px; padding: 18px 20px 40px; align-items: start; }
.col-h { font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.wires { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
.wires path { fill: none; stroke-width: 1.3; opacity: 0.5; }
.wires path.on { stroke-width: 2.6; opacity: 1; }
.hub { position: sticky; top: 58px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 6px; }
.hub h2 { font-size: 0.98rem; margin: 0; line-height: 1.35; text-wrap: balance; overflow-wrap: anywhere; }
.hub .meta { font-size: 0.76rem; }
.col { display: grid; gap: 16px; min-width: 0; }
.col-empty { color: var(--muted); font-size: 0.82rem; }
.gr { display: grid; gap: 5px; min-width: 0; }
.gr-h { font-size: 0.76rem; font-weight: 600; color: var(--muted); display: flex; gap: 6px; }
.gr-h span { font-family: var(--font-mono); font-size: 0.7rem; font-weight: 400; }
.nbr { display: grid; grid-template-columns: 13px minmax(0, 1fr); gap: 0 7px; align-items: start; width: 100%; padding: 5px 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 7px; text-align: left; cursor: pointer; min-width: 0; }
.nbr:hover { border-color: var(--accent); }
.nbr .ico { margin-top: 4px; }
.nbr b { font-weight: 600; font-size: 0.84rem; overflow-wrap: anywhere; }
.nbr small { grid-column: 2; display: block; color: var(--muted); font-size: 0.74rem; line-height: 1.4; overflow-wrap: anywhere; }
.nbr .clamp { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
.nbr:hover .clamp, .nbr:focus-visible .clamp { -webkit-line-clamp: unset; }
.tag { display: inline-block; font-size: 0.68rem; font-weight: 500; padding: 0 5px; margin-left: 5px; border-radius: 3px; background: var(--bg); color: var(--muted); border: 1px solid var(--line); vertical-align: 1px; white-space: nowrap; }
.tag.good, .dn.good { color: var(--good); }
.tag.bad, .dn.bad { color: var(--bad); }
.tag.rel { color: var(--accent); }
.more { background: none; border: 0; padding: 2px 0; color: var(--accent); font-size: 0.78rem; cursor: pointer; text-align: left; }

.detail { grid-area: detail; width: 380px; background: var(--surface); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 24px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.d-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.close { width: 28px; height: 28px; border: 0; background: none; font-size: 1.1rem; color: var(--muted); cursor: pointer; border-radius: 5px; }
.close:hover { background: var(--bg); }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 0.74rem; color: var(--muted); font-weight: 600; }
.detail h2 { font-size: 1.02rem; margin: 6px 0 4px; line-height: 1.4; text-wrap: balance; overflow-wrap: anywhere; }
.meta { color: var(--muted); font-size: 0.82rem; }
.tldr { margin: 10px 0; overflow-wrap: anywhere; }
.sec { margin-top: 14px; display: grid; gap: 6px; }
.sec h3 { margin: 0; font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 12px; margin: 10px 0 0; font-size: 0.82rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.kv dd.mono { font-family: var(--font-mono); font-size: 0.76rem; }
.warn { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 6px 9px; font-size: 0.8rem; overflow-wrap: anywhere; }
.kn { font-family: var(--font-mono); font-size: 0.76rem; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; padding: 3px 7px; overflow-wrap: anywhere; }
.open-ego { justify-self: start; margin-top: 10px; padding: 6px 12px; border: 1px solid var(--accent); border-radius: 6px; background: var(--accent-tint); color: var(--accent); font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.links { display: grid; gap: 10px; }
.lk-g { display: grid; gap: 3px; }
.lk-h { font-size: 0.76rem; font-weight: 600; color: var(--muted); }
.lk-h span { font-family: var(--font-mono); font-weight: 400; font-size: 0.7rem; }
.lk { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 0 7px; align-items: start; width: 100%; padding: 3px 6px; background: none; border: 0; border-radius: 5px; text-align: left; cursor: pointer; font-size: 0.82rem; }
.lk:hover { background: var(--accent-tint); }
.lk .ico { margin-top: 4px; }
.lk small { grid-column: 2; color: var(--muted); font-size: 0.74rem; overflow-wrap: anywhere; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 0.76rem; }
.tbl th, .tbl td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { color: var(--muted); font-weight: 600; }
.tbl td:nth-child(3) { font-family: var(--font-mono); white-space: nowrap; font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 0.8rem; }
.path { font-family: var(--font-mono); font-size: 0.74rem; color: var(--muted); word-break: break-all; }
.empty { color: var(--muted); }

@media (max-width: 1180px) { .ego-body { gap: 34px; padding-inline: 12px; } .detail { width: 330px; } }
@media (max-width: 900px) {
  html, body { height: auto; }
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "bar" "main" "detail" "rail"; }
  .stats { margin-left: 0; order: 3; }
  .search { flex: 1 1 100%; }
  .views { order: 2; width: 100%; }
  main { height: 66vh; }
  .app.ego-mode main, .app.list-mode main { height: auto; min-height: 50vh; }
  #ego, #list { position: static; }
  .rail, .detail { width: auto; border: 0; border-top: 1px solid var(--line); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .ego-body { grid-template-columns: minmax(0, 1fr); gap: 16px; padding-inline: 16px; }
  .hub { position: static; order: -1; }
  .wires { display: none; }
  .hint { display: none; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="bar">
    <div class="brand"><h1>CLEAR-EC KG Explorer</h1></div>
    <div class="search">
      <input id="q" type="search" placeholder="Search id, name, summary, direction, value…" autocomplete="off" spellcheck="false" aria-label="Search nodes" aria-controls="suggest">
      <div class="suggest" id="suggest" role="listbox" hidden></div>
    </div>
    <nav class="views" aria-label="Choose a view">
      <button id="v-graph" aria-pressed="true">Map</button>
      <button id="v-experiments" aria-pressed="false">Experiments</button>
      <button id="v-ideas" aria-pressed="false">Ideas</button>
      <button id="v-findings" aria-pressed="false">Findings</button>
      <button id="v-decisions" aria-pressed="false">Decisions</button>
      <button id="v-constraints" aria-pressed="false">Constraints</button>
      <button id="v-papers" aria-pressed="false">Papers</button>
    </nav>
    <div class="stats" id="stats"></div>
    <button class="theme-btn" id="theme" type="button" title="Switch colour theme">Theme: auto</button>
  </header>
  <aside class="rail" id="rail">
    <div class="group">
      <span class="label">Go to region</span>
      <div id="regions"></div>
    </div>
    <div class="group">
      <span class="label">Node types</span>
      <div class="chips" id="types"></div>
    </div>
    <div class="group" id="status-group">
      <span class="label">Experiment status</span>
      <div class="chips" id="exp-status"></div>
    </div>
    <div class="group">
      <label class="label" for="rel">Paper relevance to CLEAR-EC</label>
      <select id="rel"><option value="all">All papers</option><option value="high">High only</option><option value="medium">Medium or high</option></select>
    </div>
    <div class="group">
      <label class="label" for="edgeset">Links drawn on the map</label>
      <select id="edgeset">
        <option value="backbone">Backbone (strongest link per node)</option>
        <option value="lineage">Experiment lineage (stacked, superseded, baseline)</option>
        <option value="evidence">Evidence (findings, motivation)</option>
        <option value="ideas">Ideas, tests, decisions and rules</option>
        <option value="uses">Methods and data used</option>
        <option value="literature">Literature (project to paper, paper to paper)</option>
        <option value="typed">All recorded links</option>
        <option value="none">None</option>
      </select>
      <label class="check"><input type="checkbox" id="mentions"> Show body mentions</label>
    </div>
    <div class="label" id="gen"></div>
  </aside>
  <main id="main">
    <div id="stage">
      <canvas id="map" role="img" aria-label="Map of the CLEAR-EC knowledge graph: literature regions, experiment lanes and project knowledge. The same content is available in the list views above."></canvas>
      <div class="hint" id="hint">Click a region to zoom · hover a node to see its links · click a node for its connections</div>
      <div class="tip" id="tip" hidden></div>
      <div class="zoom">
        <button id="z-in" type="button" aria-label="Zoom in">+</button>
        <button id="z-out" type="button" aria-label="Zoom out">−</button>
        <button id="z-fit" type="button" class="wide" aria-label="Fit the whole map">Fit</button>
      </div>
    </div>
    <div id="ego" hidden></div>
    <div id="list" hidden></div>
  </main>
  <section class="detail" id="detail" aria-live="polite" hidden></section>
</div>

roup":"t8-synthetic","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"Cell geometries from a Cellular Potts simulation, rendered by an imaging simulation (PSF, brightness loss, noise) plus CycleGAN refinement, train a 3D StarDist that beats training on 37.5 h of manual annotation (SEG 0.534 vs 0.505); direct GAN label-to-image translation looks realistic but fails (label inconsistency).","relevance_clearec":"medium","relevance_metrics":["CV","HEX"],"relevance_note":"Best recent sim-to-real recipe for tessellated tissue: simulate geometry with measured shape statistics, render with a physical imaging model, refine with CycleGAN; warns that pure GAN translation breaks label consistency.","code_release":"open","weights_release":"open","key_numbers":["SEG / DET: SimOptiGAN+ (biophysical placement) 0.534 / 0.800 vs manual-annotation training 0.505 / 0.785 vs pretrained Cellpose nuclei 0.332 / 0.512 (verified-from-source)","Upper bound (trained on test data) 0.593 / 0.891 (verified-from-source)","Direct unpaired label-to-image GAN (Mem2NucGAN-U) 0.103 / 0.155 despite lowest KID (verified-from-source)","Manual annotation cost 37.5 h vs 0.4-4.4 h for synthetic pipelines (verified-from-source)"],"results":[{"task":"3D nuclei instance segmentation","dataset":"HT-29 spheroid, 1001 annotated nuclei","metric":"SEG","value":"0.534 (SimOptiGAN+)","comparator":"StarDist trained on manual annotation","comparator_value":"0.505","locator":"Results table","provenance":"verified-from-source"}],"suggests_try":"If we build synthetic endothelium for CV/HEX pretraining, render geometry with an explicit imaging model fit to our frames (Gaussian PSF/blur, dark cell borders, vignetting and brightness falloff like the 2023-24 images, noise) and use a GAN only as a light refinement; do not rely on unpaired label-to-image GAN alone, which can break the geometry the label depends on.","_path":"wiki/papers/bruch2025synthesis.md","degree":3,"region":"t8","short":"Bruch 2 er pixel; CD = N x 1e6 / total area; CV = std/mean area; baseline HEX = mean IoU of each cell with a fitted hexagon (not the six-sided share) (verified-from-source)","Device and label-generation procedure: not reported on any public page (verified-from-source)"],"suggests_try":"Since the organisers name KONAN as the eye-bank device and give no label algorithm, test the Konan centre-method emulator (weighted bisectors, interior cells) against the labels before assuming Voronoi or mask statistics; the baseline's hexagon-IoU HEX is not the label definition and should not be copied.","_path":"wiki/papers/clearec2026challenge.md","degree":9,"region":"t3","short":"Al-Aswad 2026 · challenge","size":11.5,"imp":3.792,"x":876.4,"y":-76.4},{"id":"daniel2019unet","type":"paper","title":"Automated segmentation of the corneal endothelium in a large set of 'real-world' specular microscopy images using the U-Net architecture","authors":["Moritz C. Daniel","Lisa Atzrodt","Felicitas Bucher","Katrin Wacker","Stefan Bohringer","Thomas Reinhard","et al."],"year":2019,"venue":"Scientific Reports","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC6426887/","tier":"core","group":"t1-endothelium-segmentation","status":"reviewed","review_depth":"deep","evidence":"peer-reviewed","tldr":"U-Net trained on watershed labels grown from expert centroid dots in 385 Topcon SP-3000 images finds only 34 % of cells (precision 0.84) yet estimates ECD with R2 0.96 vs manual, because ECD is taken as the inverse median Voronoi area of the detected cells.","relevance_clearec":"high","relevance_metrics":["CD"],"relevance_note":"This 385-image Topcon centroid set appears to be the external point set our detector was trained on; it shows density from the median Voronoi area of a confident subset is robust to very low recall.","code_release":"unknown","weights_release":"unknown","key_numbers":["385 images, 260 x 476 px, digitised from analog video prints; median 90 dotted cells per image (verified-from-source)","U tional Conference on Learning Representations (ICLR)","url":"https://arxiv.org/html/2202.00395","tier":"core","group":"t6-noisy-regression","status":"reviewed","review_depth":"deep","evidence":"peer-reviewed","tldr":"The Bayes (irreducible) error can be estimated without any model by averaging min(c, 1-c) over soft labels c = p(y=1|x); with noisy soft labels the naive estimate is biased and needs correction; ViT already reaches the estimated floor on CIFAR-10H.","relevance_clearec":"high","relevance_metrics":["CV","HEX","CD"],"relevance_note":"The principle (estimate the floor from the label-generating noise, not from models) is what we need to judge how far CV/HEX/CD OOF error sits above the irreducible label-noise floor; the method itself is binary-classification only.","code_release":"open","weights_release":"none","key_numbers":["Estimator: mean of min(c_i, 1 - c_i) over clean soft labels; unbiased, consistent, O_P(1/sqrt(n)) (verified-from-source)","Noisy soft labels: naive estimator is biased and the bias does not vanish with n (Theorem 3.3); corrected with sign labels (verified-from-source)","Fashion-MNIST-H: estimated Bayes error 3.478 % (95 % CI +-0.079) vs ResNet-18 test error 3.852 % (SE +-0.041) (verified-from-source)","CIFAR-10H: ViT B/16 error at or slightly above the estimated Bayes error after adjusting for the label distribution (verified-from-source)","ICLR accept/reject Bayes error estimates 6.8 % (2017) to 9.6 % (2022) (verified-from-source)","No regression extension in the paper (verified-from-source)"],"results":[{"task":"binary classification floor","dataset":"Fashion-MNIST-H","metric":"error","value":"3.852 % (ResNet-18)","comparator":"estimated Bayes error","comparator_value":"3.478 %","locator":"Fashion-MNIST-H experiment","provenance":"verified-from-source"}],"suggests_try":"Regression analogue for us (our derivation): floor MAPE = E|label - truth|/label from the sampling model alone; for Gaussian relative noise with SE 6.5 % (CV), 7.5 % (HEX), 3 % (CD) that is about 0.8 x SE = 5.2, 6.0, 2.4; compare with OOF 10.11 / 9.74 / 6.19 to bound what any device-behaviour model could still gain, and note that, like the paper's noisy soft labels, a floor from an uncertain noise model is itself biased.","_path":"wiki/papers/ishida2023bayeserror.md","degree":5,"region":"t6","short":"Ishida 2023 · bayeserror","size":9.0,"imp":2.693,"x":312.0,"y":584.6},{"id":"joseph2020postkeratoplasty","type":"paper","title":"Quantitative and qualitative evaluation of deep learning automatic segmentations of corneal endothelial cell images of reduced image quality obtained following cornea transplant","authors":["Naomi Joseph","Chaitanya Kolluru","Beth A. M. Benetz","Harry J. Menegay","Jonathan H. Lass","David L. Wilson"],"year":2020,"venue":"Journal of Medical Imaging","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC7019185","tier":"candidate","group":"t1-endothelium-segmentation","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"Flattening + U-Net + Otsu-based postprocessing on 130 Konan post-DSAEK CPTS images reaches cell-wise Dice 0.87 and a cell count within ~4 % of readers inside the annotated region, and finds 564 extra cells outside it (about 70 % judged acceptable); ECD/CV/HEX are not validated.","relevance_clearec":"medium","relevance_metrics":["CD"],"relevance_note":"Shows that readers annotate only a sub-region and an automatic method finds many acceptable cells outside it, which mirrors CLEAR-EC labels coming from a technician-chosen ~17 % box.","code_release":"unknown","weights_release":"unknown","key_numbers":["Cell-wise Dice 0.87 +/- 0.17, Jaccard 0.80; 92 % of automated cells Dice > 0.80 (verified-from-source)","Inside reader regions: 1876 manual vs 1798 automated cells (about 4 % fewer) (verified-from-source)","564 new cells outside reader regions, about 70 % (390) judged acceptable (verified-from-source)","Experts flagged 52 of 1876 cells (3 %); 44 (2.3 %) judged better changed (verified-from-source)","ECD/CV/HEX agreement: not reported (verified-from-source)"],"results":[{"task":"cell segmentation","dataset":"30 held-out CPTS post-DSAEK images","metric":"cell-wise Dice","value":"0.87","comparator":"reader borders","comparator_value":"reference","locator":"Results","provenance":"verified-from-source"}],"suggests_try":"Remember the label is a sub-region statistic: restrict any cell-statistic features to the 538 x 408 label box (or a predicted best box) instead of the full frame, since readers/technicians systematically pick a sub-area and cells outside it differ.","_path":"wiki/papers/joseph2020postkeratoplasty.md","degree":7,"region":"t1","short":"Joseph 2020","size":11.0,"imp":2.109,"x":-888.1,"y":-317.3},{"id":"karani2021tta","type":"paper","title":"Test-time adaptable neural networks for robust medical image segmentation","authors":["Neerav Karani","Ertunc Erdil","Krishna Chaitanya","Ender Konukoglu"],"year":2021,"venue":"Medical Image Analysis","url":"https://ar5iv.arxiv.org/html/2004.04668","tier":"candidate","group":"t7-domain-shift","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"Splits a segmenter into a small 3-layer image-normalisation CNN plus a frozen segmentation CNN; at test time only the normaliser is optimised per image so that the predicted mask agrees with a denoising-autoencoder shape prior; large gains on scanner/protocol shifts in brain and prostate MRI, none on heart, about 12 min per image.","relevance_clearec":"low","relevance_metrics":["CD","CV","HEX"],"relevance_note":"Shows that adapting only a tiny input-normalisation module (not the backbone) can fix acquisition shift, analogous to our brightness/vignetting difference between image sources; per-image cost is too high for us as published.","code_release":"open","weights_release":"unknown","key_numbers":["Brain HCP-T2 Dice: source only 0.107, + augmentation 0.083, + test-time adaptation 0.733, per-domain upper bound 0.867 (verified-from- ering a cell changes density by about 1 % per cell (verified-from-source)","Off-centred dots increase the SD of cell area (affects CV); no number given (verified-from-source)","Normal young-adult CV about 0.22-0.31 (mean 0.27, Yee et al.); normal HEX about 60 % (verified-from-source)"],"suggests_try":"Read device CV as 'CV of interior-cell polygon areas from about 150 dotted centres, with dot jitter': in any emulator, drop the outer ring of cells and add dot jitter at the level our detector has (0.2 x spacing) before fitting the map to labels, so the fitted device map is learned under the same noise the test frames will have.","_path":"wiki/papers/mccarey2008review.md","degree":10,"region":"t2","short":"McCarey 2008 · review","size":11.5,"imp":3.792,"x":849.7,"y":265.1},{"id":"nurzynska2024gan","type":"paper","title":"Application Of Generative Adversarial Network for Data Augmentation and Multiplication to Automated Cell Segmentation of the Corneal Endothelium","authors":["Karolina Nurzynska","Krystian Jandy","Pawel Weichbroth"],"year":2024,"venue":"International Conference on Information Systems Development (ISD 2024), poster","url":"https://aisel.aisnet.org/isd2014/proceedings2024/datascience/4","tier":"candidate","group":"t8-synthetic","status":"reviewed","review_depth":"light","evidence":"workshop","tldr":"A GAN trained on the small Alizarine endothelium dataset generates over 513k synthetic image/mask pairs; a segmentation model trained on part of them reaches mean IoU 81 % across datasets (poster, visual assessment).","relevance_clearec":"low","relevance_metrics":["CV","HEX"],"relevance_note":"Second example of GAN-multiplied endothelium training data; weak evidence (poster, mIoU only, stained ex vivo Alizarine images rather than specular).","code_release":"unknown","weights_release":"unknown","key_numbers":["Over 513k synthetic images generated from the Alizarine dataset (from-abstract)","Mean IoU 81 % averaged across datasets (from-abstract)","Public endothelium datasets average about 30 images (from-abstract)"],"results":[{"task":"endothelium segmentation trained on GAN data","dataset":"Alizarine + other datasets (unspecified)","metric":"mIoU","value":"81 %","comparator":"not reported","comparator_value":"not reported","locator":"Abstract","provenance":"from-abstract"}],"suggests_try":"Nothing actionable on its own; it only confirms that GAN multiplication of a tiny labelled set is feasible, which supports trying a mosaic-conditioned generator for our point/edge model only if time remains after calibration work.","_path":"wiki/papers/nurzynska2024gan.md","degree":4,"region":"t8","short":"Nurzynska 2024 · gan","size":9.0,"imp":0.693,"x":545.6,"y":-75.6},{"id":"pachitariu2025cellposesam","type":"paper","title":"Cellpose-SAM: superhuman generalization for cellular segmentation","authors":["Marius Pachitariu","Michael Rariden","Carsen Stringer"],"year":2025,"venue":"bioRxiv","url":"https://www.biorxiv.org/content/10.1101/2025.04.28.651001v1.full","tier":"core","group":"t4-cell-foundation","status":"reviewed","review_depth":"deep","evidence":"preprint","tldr":"Replaces the Cellpose U-Net with a SAM ViT-L encoder (256x256 input, 8x8 patches, global attention, flow head) trained on 22,826 images / 3.3M ROIs from ~18-20 public datasets with heavy degradation and channel-permutation augmentation; test-set error 0.163 vs inter-annotator 0.257.","relevance_clearec":"high","relevance_metrics":["CV","HEX","CD"],"relevance_note":"Our zero-shot mask baseline and one of our regression backbones; the paper shows no endothelium/epithelium/specular data in training, which explains why zero-shot area CV only reaches r 0.38 and argues for domain adaptation rather than more zero-shot tuning.","code_release":"open","weights_release":"open","key_numbers":["Cellpose test-set error rate: Cellpose-SAM 0.163 vs inter-annotator 0.257, estimated human-consensus bound 0.128, Cellpose3 0.292, CellSAM 0.328 (verified-from-source)","Training set: 22,826 images, 3,341,254 ROIs (verified-from-source)","ViT-L encoder (24 blocks, dim 1024, 305M of 312M parameters), input 256x256, patch 8x8 (verified-from-source)","Trained on cell diameters 7.5-120 px, no test-time resizing; small loss at small diameters (verified-from-source)","Robustness tested at Poisson noise scale 5/2.5/0.5, blur sigma 2/4/8, downsampling 2/5/10, anisotropic 2/6/12; matches best previous restoration models; per-condition AP only in figures (verified-from-source)","Training: 8 H200 GPUs, batch 256, about 20 h (2,000 epochs); fine-tuning fits 8-12 GB VRAM at batch 1 (verified-from-source)"],"results":[{"task":"instance segmentation","dataset":"Cellpose test set","metric":"error rate vs annotator 1","value":"0.163","comparator":"annotator 2 (inter-annotator)","comparator_value":"0.257","locator":"Results, Fig 2","provenance":"verified-from-source"},{"task":"instance segmentation","dataset":"Cellpose test set","metric":"error rate","value":"0.163","comparator":"CellSAM","comparator_value":"0.328","locator":"Results","provenance":"verified-from-source"}],"suggests_try":"Treat Cellpose-SAM as a starting point to adapt on our 8953 frames (fine-tuning fits 8-12 GB at batch 1), not as a fixed zero-shot mask source; keep diameter at our native ~25-30 px (no rescale) and skip a separate restoration step, which the authors say Cellpose-SAM does not need.","superseded":"2026-11-09: segmentation / self-training route closed for CV and HEX by the root-cause analysis; see body","_path":"wiki/papers/pachitariu2025cellposesam.md","degree":24,"region":"t4","short":"Pachitariu 2025 · cellposesam","size":14.2,"imp":4.639,"x":760.7,"y":100.9},{"id":"pan2018meanvariance","type":"paper","title":"Mean-Variance Loss for Deep Age Estimation From a Face","authors":["Hongyu Pan","Hu Han","Shiguang Shan","Xilin Chen"],"year":2018,"venue":"IEEE/CVF Conference on Computer Vision and Pattern Recognition (CVPR)","url":"https://openaccess.thecvf.com/content_cvpr_2018/html/Pan_Mean-Variance_Loss_for_CVPR_2018_paper.html","tier":"candidate","group":"t6-noisy-regression","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"Age estimation as distribution learning over discrete ages: softmax loss plus a mean loss (distribution mean vs true age) and a variance loss that keeps the predicted distribution concentrated; reported to beat prior single models on FG-NET, MORPH II and CLAP2016.","relevance_clearec":"low","relevance_metrics":["CV","HEX"],"relevance_note":"Distributional head for discrete, ambiguous targets; but its variance penalty forces sharp distributions, which conflicts with using the predictive spread for MAPE-optimal decoding under our label noise.","code_release":"unknown","weights_release":"unknown","key_numbers":["Loss = softmax + mean loss (squared gap between distribution mean and true age) + variance loss (variance of predicted distribution), trained end to end with SGD (from-abstract)","Reported to outperform state of the art by a large margin with a single model; exact MAE not reported in abstract (from-abstract)","ChaLearn/CLAP2016 epsilon-error 0.2867 per a benchmark listing (from-abstract)"],"suggests_try":"If we add a histogram/DLDL head for CV or HEX, do not add a variance penalty: with about 6.5-7.5 % irreducible label noise the predictive spread should stay wide, and it is needed to decode the 1/y-weighted median; use mean-variance only as a comparison arm if decoding by expectation.","_path":"wiki/papers/pan2018meanvariance.md","degree":5,"region":"t6","short":"Pan 2018 · meanvariance","size":9.0,"imp":0.693,"x":457.1,"y":504.0},{"id":"patel2010flexcenter","type":"paper","title":"Comparison of flex-center, center, and corner methods of corneal endothelial cell analysis","authors":["Sanjay V Patel","Jay W McLaren","Lori A Bachman","William M Bourne"],"year":2010,"venue":"Cornea","url":"https://pubmed.ncbi.nlm.nih.gov/20520534/","tier":"core","group":"t2-device-morphometry","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"On identical cells, Konan's flex-center method (which keeps the outermost cells that the center method drops) reads CV about 3 points higher than center and corner methods in normal corneas, while ECD agrees within about 1-2 %; in abnormal (post-PK) corneas CV and HEX disagree across methods.","relevance_clearec":"high","relevance_metrics":["CD","CV","HEX"],"relevance_note":"Shows that the device's analysis mode alone (which cells enter the polygon statistics) shifts CV by about 10 % relative on the same cells, an irreducible device-behaviour term in our labels.","code_release":"none","weights_release":"none","key_numbers":["Normal ECD: flex-center 2846 +- 248, center 2870 +- 253, corner 2892 +- 254 cells/mm2 (from-abstract)","Normal CV: flex-center 33 % +- 3, center 30 % +- 3, corner 30 % +- 3 (P \u003c 0.001) (from-abstract)","Normal HEX: flex-center 60 % +- 6, center 60 % +- 8, corner 58 % +- 7 (P = 0.004) (from-abstract)","PK CV: flex-center 35 % +- 13, center 30 % +- 10, corner 35 % +- 15 (P = 0.02) (from-abstract)","PK HEX: flex-center 56 % +- 19, center 54 % +- 17, corner 43 % +- 23 (P = 0.02) (from-abstract)"],"suggests_try":"When emulating the device from points, compute CV twice, interior cells only (center) and interior plus outermost cells (flex-center); see which tracks the label better on the 25 expert-marker frames, and use the winner (or both) as regressor features.","_path":"wiki/papers/patel2010flexcenter.md","degree":9,"region":"t2","short":"Patel 2010 · flexcenter","size":10.5,"imp":3.386,"x":773.2,"y":311.9},{"id":"peng2017basic","type":"paper","title":"A BaSiC tool for background and shading correction of optical microscopy images","authors":["Tingying Peng","Kurt Thorn","Timm Schroeder","Lichao Wang","Fabian J. Theis","Carsten Marr","et al."],"year":2017,"venue":"Nature Communications","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC5472168/","tier":"core","group":"t7-domain-shift","sta tional Research Society","url":"https://arxiv.org/abs/2105.05249","tier":"candidate","group":"t6-noisy-regression","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"MAPE systematically favours methods whose predictions are too low; the log accuracy ratio log(prediction/actual) is proposed instead, and least squares on it predicts the geometric mean.","relevance_clearec":"medium","relevance_metrics":["CD","CV","HEX"],"relevance_note":"Explains why a MAPE-scored challenge rewards slight under-prediction, and gives a log-space training loss whose optimum (geometric mean) is easy to reason about.","code_release":"none","weights_release":"none","key_numbers":["MAPE, when used to choose between prediction methods, systematically selects methods whose predictions are too low (from-abstract)","Least-squares regression on log(prediction/actual) predicts the geometric mean (from-abstract)","In simulations with multiplicative error the log-ratio criterion is far superior to MAPE for model selection; exact rates not reported in abstract (from-abstract)"],"suggests_try":"If we train in log space (MSE on log y), the model targets the geometric mean; under MAPE we should then shift down by a fitted per-metric factor (OOF), since the MAPE optimum lies below the median, which itself equals the geometric mean only for symmetric log errors.","_path":"wiki/papers/tofallis2015logratio.md","degree":8,"region":"t6","short":"Tofallis 2015 · logratio","size":11.0,"imp":2.109,"x":270.6,"y":401.9},{"id":"tyagi2025boxcell","type":"paper","title":"BoxCell: Leveraging SAM for Cell Segmentation with Box Supervision","authors":["Aayush Kumar Tyagi","Vaibhav Mishra","Prathosh AP","Mausam"],"year":2025,"venue":"Scientific Reports","url":"https://pmc.ncbi.nlm.nih.gov/articles/PMC12663235/","tier":"candidate","group":"t4-cell-foundation","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"Weakly supervised cell segmentation: frozen SAM turns gold b ric":"Dice %","value":"90.07 (TTA)","comparator":"single prediction","comparator_value":"88.76","locator":"Table 2","provenance":"verified-from-source"}],"suggests_try":"Average every regression and detector prediction over the 8 flip/rot90 views (label-invariant for CD/CV/HEX) plus mild brightness/gamma jitter; test on OOF whether TTA spread flags the outer-decile CV images where regression to the mean is worst.","_path":"wiki/papers/wang2019tta.md","degree":9,"region":"t7","short":"Wang 2019 · tta","size":10.5,"imp":1.886,"x":338.3,"y":-237.1},{"id":"wang2020dmcount","type":"paper","title":"Distribution Matching for Crowd Counting","authors":["Boyu Wang","Huidong Liu","Dimitris Samaras","Minh Hoai"],"year":2020,"venue":"Advances in Neural Information Processing Systems 33 (NeurIPS 2020)","url":"https://ar5iv.labs.arxiv.org/html/2009.13077","tier":"candidate","group":"t5-weak-supervision","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"Counting loss = count L1 + Sinkhorn optimal-transport distance between normalised predicted and dot maps + total variation; avoids Gaussian smoothing of dots, which the authors prove loosens the generalisation bound, and lowers counting MAE on all major crowd benchmarks.","relevance_clearec":"medium","relevance_metrics":["CD"],"relevance_note":"A drop-in loss for training a cell-density head directly on Topcon dot annotations, with an explicit image-level count term that can take the CD-derived count.","code_release":"open","weights_release":"open","key_numbers":["Loss = |predicted count - true count| + OT (Sinkhorn, 100 iterations) between normalised maps + TV distance (verified-from-source)","UCF-QNRF MAE/RMSE: DM-Count 85.6/148.3 vs Bayesian loss 88.7/154.8 vs Gaussian pixel-wise loss 106.8/183.7 (verified-from-source)","ShanghaiTech B MAE: 7.4 vs Bayesian 7.7 vs Gaussian pixel-wise 8.5 (verified-from-source)","NWPU test MAE 88.4 vs 105.4 (Bayesian); NAE 0.169 vs 0.203 (verified-from-source)","Theorem: generalisation bound of Gaussian-smoothed training depends on the smoothed-vs-real annotation gap; DM-Count bounds are tighter (verified-from-source)"],"results":[{"task":"crowd counting","dataset":"UCF-QNRF","metric":"MAE","value":"85.6","comparator":"Gaussian-smoothed pixel-wise L2","comparator_value":"106.8","locator":"main results table","provenance":"verified-from-source"}],"suggests_try":"If a density head is trained on the 385 Topcon point images, use DM-Count's OT + count loss instead of Gaussian-smoothed L2; on CLEAR-EC frames without points, keep only the count term with the CD-derived count in the analysis box (a weak, image-level signal).","_path":"wiki/papers/wang2020dmcount.md","degree":6,"region":"t5","short":"Wang 2020 · dmcount","size":10.5,"imp":1.886,"x":-229.2,"y":174.0},{"id":"wang2021tent","type":"paper","title":"Tent: Fully Test-time Adaptation by Entropy Minimization","authors":["Dequan Wang","Evan Shelhamer","Shaoteng Liu","Bruno Olshausen","Trevor Darrell"],"year":2021,"venue":"ICLR 2021","url":"https://ar5iv.labs.arxiv.org/html/2006.10726","tier":"candidate","group":"t7-domain-shift","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"At test time, re-estimate normalisation statistics on target batches and optimise only the normalisation affine parameters to minimise prediction entropy; ImageNet-C error 44.0 % online vs 49.9 % for test-time BN; needs class probabilities and batches, fails on some shifts.","relevance_clearec":"low","relevance_metrics":["CD","CV","HEX"],"relevance_note":"Reference TTA baseline; not directly usable for our regression heads (no entropy) unless CV/HEX are cast as binned classification, and its gains rest on target-batch BN statistics that hurt regression in other work.","code_release":"open","weights_release":"none","key_numbers":["ImageNet-C mean error: test-time BN 49.9 %, Tent 44.0 % online, 42.3 % offline (verified-from-source)","CIFAR-10-C sev 5 error: source 40.8, BN 17.3, Tent 14.3; CIFAR-100-C: 67.2 / 42.6 / 37.3 (verified-from-source)","MNIST->SVHN: Tent raises error to 79.8 % vs 71.3 % source-only (verified-from-source)","Updating the full model never beat the unadapted source model; only normalisation affine parameters (\u003c1 % of weights) are updated (verified-from-source)"],"results":[{"task":"image classification under corruption","dataset":"ImageNet-C","metric":"error","value":"44.0 %","comparator":"test-time BN","comparator_value":"49.9 %","locator":"Sec 4","provenance":"verified-from-source"}],"suggests_try":"Do not apply Tent to our regression heads; if a binned (classification-style) CV/HEX head is adopted, entropy TTA becomes possible but should first be tested on the old->new source split, given the documented failure modes.","_path":"wiki/papers/wang2021tent.md","degree":8,"region":"t7","short":"Wang 2021 · tent","size":10.5,"imp":1.386,"x":315.5,"y":-185.9},{"id":"wu2026scimars","type":"paper","title":"SciMARS: Multi-Agent Recursive Self-Improvement for Closed-Loop Scientific Discovery","authors":["Wu","Liu"],"year":2026,"venue":"arXiv","url":"https://arxiv.org/abs/2611.12552","tier":"candidate","group":"framework","status":"reviewed","review_depth":"light","evidence":"preprint","tldr":"A fixed multi-agent team fails because evidence stays in one agent's history and fixed procedures keep repeating a recorded mistake; the answer is a shared typed append-only evidence graph, one-change-at-a-time editors, probes with a matched comparison before replacing the incumbent, and a reflection step that writes short lessons.","relevance_clearec":"medium","relevance_note":"Not a method for CD/CV/HEX: it is the source of the 2026-11-11 framework revision (ledger, decision ids, lessons L1-L7, verifier, probe first).","code_release":"unknown","weights_release":"unknown","key_numbers":["Benchmark replays with small counts, for example 12 of 18 against 8 of 18 (as quoted in docs/FRAMEWORK_REVISION_20261111.md; not verified from the paper)"],"_path":"wiki/papers/wu2026scimars.md","degree":2,"region":"project","short":"Wu 2026 · scimars","size":9.8,"imp":1.599,"x":-150.9,"y":-463.2},{"id":"wustefeld2023blobcount","type":"paper","title":"Learning to Segment Blob-like Objects by Image-Level Counting","authors":["Konstantin Wüstefeld","Robin Ebbinghaus","Frank Weichert"],"year":2023,"venue":"Applied Sciences","url":"https://mdpi.com/2076-3417/13/22/12219","tier":"candidate","group":"t5-weak-supervision","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"A segmentation network with an added counting head is trained only on image-level object counts; a contrast loss and a morphological loss make the last layer produce high-contrast blobs, giving F1 comparable to full supervision on blob-like microscopy objects.","relevance_clearec":"medium","relevance_metrics":["CD"],"relevance_note":"Direct example of learning a per-object map from image-level counts in microscopy; our CD label is an image-level count proxy for the analysis region.","code_release":"unknown","weights_release":"unknown","key_numbers":["Supervision = image-level object counts only, via a counting head on a standard segmentation network (from-abstract)","Two extra losses (contrast loss, morphological loss) force a high-contrast, blob-like output before counting (from-abstract)","Reported F1 comparable to fully supervised training; exact values not reported in abstract (from-abstract)"],"suggests_try":"Count-supervision only makes sense for CD here: our detector already has point supervision from 385 Topcon images, so use the CD-derived count in the analysis box as an extra loss on the detector heatmap (sum of blobs) rather than as the only label.","_path":"wiki/papers/wustefeld2023blobcount.md","degree":3,"region":"t5","short":"Wüstefeld 2023 · blobcount","size":9.0,"imp":1.193,"x":-211.1,"y":125.9},{"id":"xie2018counting","type":"paper","title":"Microscopy cell counting and detection with fully convolutional regression networks","authors":["Weidi Xie","J. Alison Noble","Andrew Zisserman"],"year":2018,"venue":"Computer Methods in Biomechanics and Biomedical Engineering: Imaging & Visualization","url":"https://api.crossref.org/works/10.1080/21681163.2016.1149104","tier":"candidate","group":"t5-weak-supervision","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"Fully convolutional regression networks predict a cell density map from dot annotations, counting clumped and overlapping cells where segmentation fails; networks trained only on synthetic images transfer to real microscopy, and fine-tuning improves them further.","relevance_clearec":"medium","relevance_metrics":["CD"],"relevance_note":"The standard deep density-map recipe for microscopy cells; the synthetic-to-real transfer claim supports training a density/centre head on synthetic endothelium plus the 385 Topcon point images.","code_release":"unknown","weights_release":"unknown","key_numbers":["Density-map regression with two FCRN architectures accepting arbitrary input size (from-abstract)","Networks trained only on synthetic images perform well on real microscopy without fine-tuning; fine-tuning improves further (from-abstract)","State-of-the-art counting on standard synthetic benchmarks; exact errors not reported in abstract (from-abstract)"],"suggests_try":"Treat a density head as the cheapest location-aware CD estimator: train on Gaussian-smoothed Topcon points (plus any synthetic endothelium from the t8 notes), integrate over the recorded analysis box, and use it as an ensemble member or feature for CD.","_path":"wiki/papers/xie2018counting.md","degree":5,"region":"t5","short":"Xie 2018 · counting","size":10.5,"imp":1.886,"x":-106.9,"y":126.5},{"id":"yang2021imbalanced","type":"paper","title":"Delving into Deep Imbalanced Regression","authors":["Yuzhe Yang","Kaiwen Zha","Ying-Cong Chen","Hao Wang","Dina Katabi"],"year":2021,"venue":"International Conference on Machine Learning (ICML)","url":"https://ar5iv.labs.arxiv.org/html/2102.09554","tier":"core","group":"t6-noisy-regression","status":"reviewed","review_depth":"deep","evidence":"peer-reviewed","tldr":"Defines deep imbalanced regression and proposes label distribution smoothing (LDS, inverse smoothed-density loss weights) and feature distribution smoothing (FDS); they cut few-shot (tail) error a lot, overall error a little, and sometimes raise many-shot error.","relevance_clearec":"high","relevance_metrics":["CV","HEX","CD"],"relevance_note":"Our CV errors concentrate in the outer label deciles; DIR is the standard toolkit for tail-range regression, but its objective (balanced error) is not our objective (natural-distribution MAPE).","code_release":"open","weights_release":"unknown","key_numbers":["AgeDB-DIR MAE All/Many/Medium/Few: vanilla 7.77/6.62/9.55/13.67 vs LDS+FDS 7.55/7.01/8.24/10.79 (verified-from-source)","IMDB-WIKI-DIR MAE All/Many/Medium/Few: vanilla 8.06/7.23/15.12/26.33 vs LDS+FDS 7.78/7.20/12.61/22.19 (verified-from-source)","LDS default: Gaussian kernel size 5, sigma 2, loss weights = inverse of smoothed label density (verified-from-source)","Many-shot MAE rises on AgeDB-DIR from 6.62 to 7.01 with LDS+FDS (verified-from-source)","FDS shows tail-range features inherit dense-range statistics (ages 0-6 look like age 30) (verified-from-source)"],"results":[{"task":"age regression","dataset":"AgeDB-DIR","metric":"MAE all","value":"7.55","comparator":"vanilla","comparator_value":"7.77","locator":"Table (AgeDB-DIR main results)","provenance":"verified-from-source"},{"task":"age regression","dataset":"IMDB-WIKI-DIR","metric":"MAE few-shot","value":"22.19","comparator":"vanilla","comparator_value":"26.33","locator":"Table (IMDB-WIKI-DIR main results)","provenance":"verified-from-source"}],"suggests_try":"Try LDS-style weights on the CV/HEX loss only with a softened exponent (e.g. inverse sqrt density) and judge purely by overall OOF MAPE; expect tail-decile error down but central error up, so net gain is uncertain (the paper's overall gain is only about 3 % relative).","_path":"wiki/papers/yang2021imbalanced.md","degree":9,"region":"t6","short":"Yang 2021 · imbalanced","size":11.0,"imp":3.609,"x":380.3,"y":586.4},{"id":"yao2022cmixup","type":"paper","title":"C-Mixup: Improving Generalization in Regression","authors":["Huaxiu Yao","Yiping Wang","Linjun Zhang","James Zou","Chelsea Finn"],"year":2022,"venue":"Advances in Neural Information Processing Systems (NeurIPS)","url":"https://ar5iv.labs.arxiv.org/html/2210.05775","tier":"candidate","group":"t6-noisy-regression","status":"reviewed","review_depth":"light","evidence":"peer-reviewed","tldr":"Mixup for regression that picks mixing partners with a Gaussian kernel on label distance, so interpolated labels stay plausible; small but consistent gains in RMSE and MAPE, including on echocardiogram ejection-fraction regression.","relevance_clearec":"medium","relevance_metrics":["CV","HEX","CD"],"relevance_note":"Cheap regulariser for image regression heads reported in MAPE on a medical video task; label-aware pairing is natural for our scalar CD/CV/HEX targets.","code_release":"open","weights_release":"unknown","key_numbers":["Echo (ejection fraction) RMSE/MAPE: ERM 5.402/8.700 % vs mixup 5.393/8.838 % vs C-Mixup 5.177/8.435 % (verified-from-source)","NO2 RMSE/MAPE: ERM 0.537/13.615 % vs C-Mixup 0.509/12.998 % (verified-from-source)","Abstract: +6.56 % in-distribution, +4.76 % task generalisation, +5.82 % OOD robustness vs best prior approach (verified-from-source)","Partner sampling: P(j | i) proportional to exp(-||y_i - y_j||^2 / (2 sigma^2)) (verified-from-source)"],"results":[{"task":"ejection-fraction regression","dataset":"EchoNet (Echo)","metric":"MAPE","value":"8.435 %","comparator":"ERM","comparator_value":"8.700 %","locator":"Table 1","provenance":"verified-from-source"}],"suggests_try":"If any end-to-end fine-tuning run remains, add C-Mixup on images with partners sampled by label distance (separately per metric, or by CV label which has the largest gap); expected gain is a few percent relative at best, so only worth it as a free add-on to a run we already do.","_path":"wiki/papers/yao2022cmixup.md","degree":8,"region":"t6","short":"Yao 2022 · cmixup","size":11.0,"imp":2.109,"x":452.0,"y":439.7},{"id":"yoon2024dgreview","type":"paper","title":"Domain Generalization for Medical Image Analysis: A Review","authors":["Jee Seok Yoon","Kwanseok Oh","Yooseung Shin","Maciej A. Mazurowski","Heung-Il Suk"],"year":2024,"venue":"arXiv","url":"https://arxiv.org/html/2310.08598v3","tier":"candidate","group":"t7-domain-shift","status":"reviewed","review_depth":"light","evidence":"review","tldr":"Workflow-oriented review of domain generalisation in medical imaging with a data-level / feature-level / model-level / analysis-level taxonomy; no quantitative benchmark, no regression tasks; notes histogram matching scored best among common DG methods in one cited benchmark and lists intensity normalisation, augmentation and ensembles as data/model-level tools.","relevance_clearec":"low","relevance_metrics":["CD","CV","HEX"],"relevance_note":"Map of options for our two-source acquisition shift; it confirms that data-level methods (normalisation, augmentation) are the efficient first step, but offers no regression-specific or quantitative guidance.","code_release":"none","weights_release":"none","key_numbers":["Taxonomy: data-level, feature-level, model-level, analysis-level (verified-from-source)","Cites a benchmark where histogram matching had the highest performance among some commonly used DG methods (verified-from-source)","No quantitative comparison table; regression tasks not discussed (verified-from-source)"],"suggests_try":"As a cheap baseline for the darker 2023-24 frames, test histogram matching of each image to a reference intensity histogram from the other source (alongside flat-field correction and augmentation) and compare per-source MAPE.","_path":"wiki/papers/ ation, unseen domains","dataset":"7 unseen sets (MRI, US)","metric":"Dice (avg)","value":"80.0","comparator":"CycleGAN domain adaptation","comparator_value":"63.5","locator":"Table II","provenance":"verified-from-source"}],"suggests_try":"Add BigAug-style appearance augmentation (gamma 0.5-2, brightness/contrast, radial vignetting field, blur/sharpen, noise) to the regression and detector training, and check the gap between old and new source MAPE plus OOF HEX; avoid geometric scaling, which changes CD.","_path":"wiki/papers/zhang2020bigaug.md","degree":13,"region":"t7","short":"Zhang 2020 · bigaug","size":11.5,"imp":3.792,"x":338.2,"y":-126.4}],"edges":[{"source":"con-12h-full-data-retrain","target":"exp-bb-cpsam512-two-fold","type":"constrains","origin":"frontmatter"},{"source":"con-audit-beliefs-first","target":"idea-device-formula-audit","type":"constrains","origin":"frontmatter","bb":1},{"source":"con-first-place-objective","target":"dec-011-submission2-hold","type":"constrains","origin":"frontmatter","bb":1},{"source":"con-gpu-not-idle","target":"con-no-gpu-jobs-after-20261113-shutdown","type":"mentions","origin":"body"},{"source":"con-gpu-not-idle","target":"dec-021-gpu-shutdown-closeout-20261113","type":"mentions","origin":"body"},{"source":"con-gpu-not-idle","target":"exp-bb-synth-recipe-a-seed47-fold0","type":"mentions","origin":"body"},{"source":"con-kept-gains-stay-kept","target":"dec-005-kept-gains-correction","type":"constrains","origin":"frontmatter"},{"source":"con-lesson-l1-member-alone-vs-stack","target":"method-nested-blend","type":"constrains","origin":"frontmatter"},{"source":"con-lesson-l1-member-alone-vs-stack","target":"con-no-statistical-gates","type":"mentions","origin":"body"},{"source":"con-lesson-l1-member-alone-vs-stack","target":"dec-015-framework-revision-20261111","type":"mentions","origin":"body"},{"source":"con-lesson-l2-screen-folds-not-a-gain","target":"con-no-statistical-gates","type":"mentions","origin":"body"},{"source":"con-l   const sections = [];  // [heading, rows html]
  const bucket = (keyOf, labelOf, orderOf) => {
    const m = new Map(); nodes.forEach(n => { const k = keyOf(n); if (!m.has(k)) m.set(k, []); m.get(k).push(n); });
    return [...m.entries()].sort((a, b) => orderOf(a[0]) - orderOf(b[0]) || String(a[0]).localeCompare(String(b[0]))).map(([k, list]) => [labelOf(k), list]);
  };
  if (cfg.type === "experiment") {
    bucket(n => n.lane || "?", k => LANE_LABEL[k] || k, k => rank(LANE_ORDER, k)).forEach(([label, list]) => {
      list.sort((a, b) => rank(EXP_STATUS, a.status) - rank(EXP_STATUS, b.status) || String(b.date || "").localeCompare(String(a.date || "")) || a.id.localeCompare(b.id));
      sections.push([label, list.map(n => listRow(n, `${esc(n.status || "")} · ${esc(n.date || "")} · folds ${esc(n.folds ?? "-")} · ${esc((n.metrics || []).join(", "))} ${deltaTag(n)}${n.ambiguous ? ' <span class="tag bad">ambiguous</span>' : ""}`,
        `Value: ${esc(clip(n.value, 140))} · Baseline: ${esc(clip(n.baseline, 120))}`)).join("")]);
    });
  } else if (cfg.type === "idea") {
    bucket(n => n.status || "?", k => k, k => rank(IDEA_STATUS, k)).forEach(([label, list]) => {
      list.sort((a, b) => b.imp - a.imp);
      sections.push([label, list.map(n => {
        const cost = [n.cost, n.cost_hours != null ? `${fmtNum(n.cost_hours)} ${n.cost_unit || "h"}` : null].filter(x => !isEmpty(x)).map(fmtNum).join(" ");
        const gain = [n.potential_gain, n.potential_metric].filter(x => !isEmpty(x)).map(fmtNum).join(" on ");
        return listRow(n, esc([n.origin ? ORIGIN[n.origin] || n.origin : null, n.aims_at && n.aims_at.length ? "aims at " + [].concat(n.aims_at).join(", ") : null, n.owner_lane ? "owner " + (LANE_LABEL[n.owner_lane] || n.owner_lane) : null, cost ? "cost " + cost : null, gain ? "potential " + gain : null, `tested by ${countOut(n.id, "tested_by")}`].filter(Boolean).join(" · ")));
      }).join("")]);
    });
  } else if (cfg.type === "finding") {
    bucket(n => n.status || "?", k => k, k => rank(FIND_STATUS, k)).forEach(([label, list]) => {
      list.sort((a, b) => String(b.date || "").localeCompare(String(a.date || "")) || a.id.localeCompare(b.id));
      sections.push([label, list.map(n => listRow(n, esc([(n.metrics || []).join(", "), n.date, `supported by ${countIn(n.id, "supports_finding")}`, countIn(n.id, "contradicts_finding") ? `contradicted by ${countIn(n.id, "contradicts_finding")}` : null].filter(Boolean).join(" · ")))).join("")]);
    });
  } else if (cfg.type === "decision") {
    bucket(n => n.status || "?", k => k, k => rank(DEC_STATUS, k)).forEach(([label, list]) => {
      list.sort((a, b) => b.id.localeCompare(a.id));
      sections.push([label, list.map(n => listRow(n, esc([n.date, n.deciders && [].concat(n.deciders).join(", ")].filter(Boolean).join(" · ")))).join("")]);
    });
  } else if (cfg.type === "constraint") {
    bucket(n => (n.scope === "global" ? "Global rules" : "Scoped rules"), k => k, k => (k === "Global rules" ? 0 : 1)).forEach(([label, list]) => {
      list.sort((a, b) => (a.origin === "user" ? 0 : 1) - (b.origin === "user" ? 0 : 1) || a.id.localeCompare(b.id));
      sections.push([label, list.map(n => listRow(n, esc([n.status, n.origin ? ORIGIN[n.origin] || n.origin : null, n.date, `constrains ${countOut(n.id, "constrains")}`].filter(Boolean).join(" · ")))).join("")]);
    });
  } else {
    const relRank = n => rank(["high", "medium", "low"], n.relevance_clearec || n.relevance_circe);
    bucket(n => n.group || "?", k => GROUP_LABEL[k] || k, k => { const i = Object.keys(GROUP_LABEL).indexOf(k); return i < 0 ? 99 : i; }).forEach(([label, list]) => {
      list.sort((a, b) => relRank(a) - relRank(b) || (b.year || 0) - (a.year || 0));
      sections.push([label, list.map(n => listRow(n, esc([n.year, n.venue, "relevance " + (n.relevance_clearec || n.relevance_circe || "-"), n.tier, n.evidence].filter(Boolean).join(" · ")) + (n.superseded ? ' <span class="tag bad">superseded</span>' : ""))).join("")]);
    });
  }
  const opt = (v, label, curV) => `<option value="${esc(v)}"${v === curV ? " selected" : ""}>${esc(label)}</option>`;
  const total = DATA.nodes.filter(n => n.type === cfg.type && !n.stub).length;
  let head = `<div class="list-head"><h2>${esc(cfg.title)}</h2><span class="n">${nodes.length} of ${total}</span>`;
  if (statuses.length) head += `<select id="lf-status" aria-label="Filter by status">${opt("all", "All statuses", state.listStatus)}${statuses.map(s => opt(s, `${s} (${DATA.nodes.filter(n => n.type === cfg.type && n.status === s).length})`, state.listStatus)).join("")}</select>`;
  if (lanes.length) head += `<select id="lf-lane" aria-label="Filter by lane">${opt("all", "All lanes", state.listLane)}${lanes.map(l => opt(l, LANE_LABEL[l] || l, state.listLane)).join("")}</select>`;
  head += `</div>`;
  const keepScroll = L.dataset.view === state.view ? L.scrollTop : 0;
  L.innerHTML = head + (sections.map(([label, rows]) => `<h3 class="lh">${esc(label)}</h3>${rows}`).join("") || `<p class="empty">No items.</p>`);
  L.dataset.view = state.view;
  L.scrollTop = keepScroll;
  const fs = $("lf-status"); if (fs) fs.onchange = e => { state.listStatus = e.target.value; L.scrollTop = 0; renderList(); };
  const fl = $("lf-lane"); if (fl) fl.onchange = e => { state.listLane = e.target.value; L.scrollTop = 0; renderList(); };
  L.querySelectorAll(".row").forEach(r => {
    r.onclick = () => { selectNode(r.dataset.id); showDetail(r.dataset.id); L.querySelectorAll(".row").forEach(x => x.classList.toggle("sel", x === r)); };
    r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); r.onclick(); } };
  });
}
const TABS = ["graph", "experiments", "ideas", "findings", "decisions", "constraints", "papers"];
function showView(v) {
  const prev = state.view;
  state.view = v;
  TABS.forEach(k => $("v-" + k).setAttribute("aria-pressed", k === v));
  $("app").classList.toggle("ego-mode", v === "ego");
  $("app").classList.toggle("list-mode", v !== "ego" && v !== "graph");
  $("stage").hidden = v !== "graph";
  $("ego").hidden = v !== "ego";
  $("list").hidden = v === "graph" || v === "ego";
  $("rail").hidden = v === "ego";
  tip.hidden = true;
  if (v === "graph") {
    state.trail = state.sel ? [state.sel] : [];
    try { history.replaceState(null, "", location.pathname + location.search); } catch (err) { /* ignore */ }
    requestAnimationFrame(() => { setHighlight(state.sel); if (state.sel) centerOn(state.sel); requestDraw(); });
    if (state.sel && !$("detail").hidden) showDetail(state.sel);
  } else if (v !== "ego") {
    if (prev !== v) { state.listStatus = "all"; state.listLane = "all"; $("list").dataset.view = ""; }
    renderList();
    if (state.sel && !$("detail").hidden) showDetail(state.sel);
  }
}
TABS.forEach(k => $("v-" + k).onclick = () => showView(k));
$("rel").onchange = e => { state.rel = e.target.value; applyFilters(); };
$("edgeset").onchange = e => { state.edges = e.target.value; applyFilters(); };

// ---------- theme ----------
const THEMES = ["auto", "light", "dark"];
function setTheme(mode) {
  if (mode === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", mode);
  $("theme").textContent = "Theme: " + mode;
  store.set("clearec-kg-theme", mode === "auto" ? null : mode);
}
$("theme").onclick = () => setTheme(THEMES[(THEMES.indexOf(document.documentElement.getAttribute("data-theme") || "auto") + 1) % THEMES.length]);
function applyTheme() { readPalette(); placed.key = null; requestDraw(); if (state.view === "ego") drawWires(); }
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

// ---------- start ----------
const savedTheme = store.get("clearec-kg-theme");
if (savedTheme === "light" || savedTheme === "dark") setTheme(savedTheme);
readPalette();
$("gen").textContent = "Data as of " + String(DATA.generated || "").replace("T", " ").slice(0, 16);
applyFilters();
measure(); fitAll();
requestDraw();
const start = decodeURIComponent((location.hash || "").slice(1));
if (start && byId.has(start)) openEgo(start);
</script>
</body>
</html>
